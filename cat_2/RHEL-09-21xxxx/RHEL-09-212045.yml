---

{{ if .Vars.rhel_09_212045 }}
command:
  live_grub_slub:
    title: RHEL-09-212045 | RHEL 9 must clear memory when it is freed to prevent use-after-free attacks. | live
    exec: grubby --info=ALL | grep args | grep -v 'init_on_free=1'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/.*init_on_free=1/'
    meta:
      Cat: 2
      CCI:
      - CCI-001084
      - CCI-002824
      Group_Title:
      - SRG-OS-000433-GPOS-00192
      - SRG-OS-000134-GPOS-00068
      NIST800-53R4:
      - CM-6
      - SC-3
      Rule_ID: SV-257794r1069362_rule
      STIG_ID: RHEL-09-212045
      Vul_ID: V-257794
file:
  default_grub_slub:
    title: RHEL-09-212045 | RHEL 9 must clear memory when it is freed to prevent use-after-free attacks. | default grub
    path: /etc/default/grub
    exists: true
    contents:
    - '!/^GRUB_CMDLINE_LINUX=".*init_on_free=1/'
    meta:
      Cat: 2
      CCI:
      - CCI-001084
      - CCI-002824
      Group_Title:
      - SRG-OS-000433-GPOS-00192
      - SRG-OS-000134-GPOS-00068
      NIST800-53R4:
      - CM-6
      - SC-3
      Rule_ID: SV-257794r1069362_rule
      STIG_ID: RHEL-09-212045
      Vul_ID: V-257794
{{ end }}

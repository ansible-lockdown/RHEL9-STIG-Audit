---

{{ if .Vars.rhel_09_213095 }}
command:
  user_coredump:
    title: RHEL-09-213095 | RHEL 9 must disable core dumps for all users.
    exec: grep -hsE '^[[:blank:]]*[^#[:blank:]]+[[:blank:]]+(hard|soft|-)[[:blank:]]+core([[:blank:]]|$)' /etc/security/limits.conf /etc/security/limits.d/*.conf
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '/^[[:blank:]]*\*[[:blank:]]+hard[[:blank:]]+core[[:blank:]]+0[[:blank:]]*$/'
    - '!/^[[:blank:]]*[^[:blank:]]+[[:blank:]]+(hard|-)[[:blank:]]+core[[:blank:]]+([1-9]|unlimited|infinity)/'
    meta:
      Cat: 2
      CCI: CCI-000366
      Group_Title: SRG-OS-000480-GPOS-00227
      NIST800-53R4: CM-6
      Rule_ID: SV-257814r1268251_rule
      STIG_ID: RHEL-09-213095
      Vul_ID: V-257814
{{ end }}

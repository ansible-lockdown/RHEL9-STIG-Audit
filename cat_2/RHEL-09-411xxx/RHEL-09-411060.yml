---

{{ if .Vars.rhel_09_411060 }}
command:
  user_defined_homedir_etc_passwd:
    title: RHEL-09-411060 | All RHEL 9 local interactive users must have a home directory assigned in the /etc/passwd file.
    timeout: {{ .Vars.timeout_ms }}
    exec: 'awk -F: ''($3>=1000)&&($7 !~ /nologin/)&&($6==""){print $1}'' /etc/passwd'
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      Cat: 2
      CCI:
      - CCI-000366
      Group_Title:
      - SRG-OS-000480-GPOS-00227
      NIST800-53R4:
      - CM-6
      Rule_ID: SV-258051r1268251_rule
      STIG_ID: RHEL-09-411060
      Vul_ID: V-258051
{{ end }}

---

{{ if .Vars.rhel_09_611170 }}
  {{ if .Vars.rhel9stig_smartcard_reader }}
command:
  card_reader_sssd_multifactor:
    title: RHEL-09-611170 | RHEL 9 must implement certificate status checking for multifactor authentication.
    exec: cat /etc/sssd/sssd.conf /etc/sssd/conf.d/* 2>/dev/null | grep -i '^[[:space:]]*certificate_verification[[:space:]]*=[[:space:]]*ocsp_dgst=sha512'
    exit-status: 0
    stdout:
    - '/ocsp_dgst=sha512/'
    meta:
      Cat: 2
      CCI:
      - CCI-001948
      - CCI-001954
      - CCI-004046
      Group_Title:
      - SRG-OS-000375-GPOS-00160
      - SRG-OS-000377-GPOS-00162
      NIST800-53R4:
      - IA-2
      Rule_ID: SV-258123r1134923_rule
      STIG_ID: RHEL-09-611170
      Vul_ID: V-258123
  {{ end }}
{{ end }}

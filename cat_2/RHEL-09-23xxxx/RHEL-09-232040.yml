---

{{ if .Vars.rhel_09_232040 }}
command:
  crondirs_perms:
    title: RHEL-09-232040 | RHEL 9 permissions of cron configuration files and directories must not be modified from the operating system defaults.
    exec: find /etc -type d -name  cron.* ! -perm 755
    exit-status: 0
    stdout:
    - '!/.*/'
    meta:
      Cat: 2
      CCI: CCI-000366
      Group_Title: SRG-OS-000480-GPOS-00227
      NIST800-53R4: CM-6
      Rule_ID: SV-257888r1069378_rule
      STIG_ID: RHEL-09-232040
      Vul_ID: V-257888
  cronfiles_perms:
    title: RHEL-09-232040 | RHEL 9 permissions of cron configuration files and directories must not be modified from the operating system defaults.
    exec: for file in /etc/crontab /etc/cron.allow /etc/cron.deny /etc/cron.d/0hourly; do stat -c "%a" $file 2> /dev/null | grep -v 644; done
    exit-status:
      or: 1
    stdout:
    - '!/.*/'
    meta:
      Cat: 2
      CCI: CCI-000366
      Group_Title: SRG-OS-000480-GPOS-00227
      NIST800-53R4: CM-6
      Rule_ID: SV-257888r1069378_rule

    exec:  grep -r sysadm_r /etc/sudoers /etc/sudoers.d
    exit-status: 0
    stdout:
    - '/^.*:.*ALL=(ALL) TYPE=sysadm_t ROLE=sysadm_r ALL/'
    meta:
      Cat: 2
      CCI: CCI-002235
      NIST800-53R4: AC-6
      Group_Title: SRG-OS-000445-GPOS-00199
      Rule_ID: SV-272496r1082184_rule
      STIG_ID: RHEL-09-431016
      Vul_ID: V-272496
{{ end }}

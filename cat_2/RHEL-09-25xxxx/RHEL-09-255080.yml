---

{{ if .Vars.rhel_09_255080 }}
file:
  ssh_config_hostbasedauth:
    title: RHEL-09-255080 | RHEL 9 must not allow a noncertificate trusted host SSH logon to the system.
    path: {{ .Vars.rhel9stig_sshd_config_file }}
    exists: true
    contents:
    - '/^HostbasedAuthentication {{ .Vars.rhel9stig_sshd_config.hostauth }}/'
    meta:
      Cat: 2
      CCI:
      - CCI-000366
      Group_Title:
      - SRG-OS-000480-GPOS-00229
      NIST800-53R4:
      - CM-6
      Rule_ID: SV-257992r1045047_rule
      STIG_ID: RHEL-09-255080
      Vul_ID: V-257992
command:
  ssh_dropin_hostbasedauth:
    title: RHEL-09-255080 | RHEL 9 must not allow a noncertificate trusted host SSH logon to the system.
    exec: grep -hiE '^[[:blank:]]*HostbasedAuthentication([[:blank:]]|=)' /etc/ssh/sshd_config.d/*.conf 2>/dev/null | grep -viE '^[[:blank:]]*HostbasedAuthentication([[:blank:]]+|[[:blank:]]*=[[:blank:]]*){{ .Vars.rhel9stig_sshd_config.hostauth }}[[:blank:]]*$'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/(?i)HostbasedAuthentication/'
    meta:
      Cat: 2
      CCI:
      - CCI-000366
      Group_Title:
      - SRG-OS-000480-GPOS-00229
      NIST800-53R4:
      - CM-6
      Rule_ID: SV-257992r1045047_rule
      STIG_ID: RHEL-09-255080
      Vul_ID: V-257992
{{ end }}

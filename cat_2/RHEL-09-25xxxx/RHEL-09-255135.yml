---

{{ if .Vars.rhel_09_255135 }}
file:
  ssh_config_gssapiauth:
    title: RHEL-09-255135 | RHEL 9 SSH daemon must not allow GSSAPI authentication.
    path: {{ .Vars.rhel9stig_sshd_config_file }}
    exists: true
    contents:
    - '/^GSSAPIAuthentication {{ .Vars.rhel9stig_sshd_config.gssapiauth }}/'
    meta:
      Cat: 2
      CCI:
      - CCI-001813
      Group_Title:
      - SRG-OS-000364-GPOS-00151
      - SRG-OS-000480-GPOS-00227
      NIST800-53R4:
      - CM-5
      Rule_ID: SV-258003r1045065_rule
      STIG_ID: RHEL-09-255135
      Vul_ID: V-258003
command:
  ssh_dropin_gssapiauth:
    title: RHEL-09-255135 | RHEL 9 SSH daemon must not allow GSSAPI authentication.
    exec: grep -hiE '^[[:blank:]]*GSSAPIAuthentication([[:blank:]]|=)' /etc/ssh/sshd_config.d/*.conf 2>/dev/null | grep -viE '^[[:blank:]]*GSSAPIAuthentication([[:blank:]]+|[[:blank:]]*=[[:blank:]]*){{ .Vars.rhel9stig_sshd_config.gssapiauth }}[[:blank:]]*$'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/(?i)GSSAPIAuthentication/'
    meta:
      Cat: 2
      CCI:
      - CCI-001813
      Group_Title:
      - SRG-OS-000364-GPOS-00151
      - SRG-OS-000480-GPOS-00227
      NIST800-53R4:
      - CM-5
      Rule_ID: SV-258003r1045065_rule
      STIG_ID: RHEL-09-255135
      Vul_ID: V-258003
{{ end }}

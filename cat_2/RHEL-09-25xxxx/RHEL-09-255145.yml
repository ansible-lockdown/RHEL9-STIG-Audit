---

{{ if .Vars.rhel_09_255145 }}
file:
  ssh_config_ignorerhosts:
    title: RHEL-09-255145 | RHEL 9 SSH daemon must not allow rhosts authentication.
    path: {{ .Vars.rhel9stig_sshd_config_file }}
    exists: true
    contents:
    - '/^IgnoreRhosts {{ .Vars.rhel9stig_sshd_config.ignorerhosts }}/'
    meta:
      Cat: 2
      CCI:
      - CCI-000366
      Group_Title:
      - SRG-OS-000480-GPOS-00227
      NIST800-53R4:
      - CM-6
      Rule_ID: SV-258005r1045069_rule
      STIG_ID: RHEL-09-255145
      Vul_ID: V-258005
command:
  ssh_dropin_ignorerhosts:
    title: RHEL-09-255145 | RHEL 9 SSH daemon must not allow rhosts authentication.
    exec: grep -hiE '^[[:blank:]]*IgnoreRhosts([[:blank:]]|=)' /etc/ssh/sshd_config.d/*.conf 2>/dev/null | grep -viE '^[[:blank:]]*IgnoreRhosts([[:blank:]]+|[[:blank:]]*=[[:blank:]]*){{ .Vars.rhel9stig_sshd_config.ignorerhosts }}[[:blank:]]*$'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/(?i)IgnoreRhosts/'
    meta:
      Cat: 2
      CCI:
      - CCI-000366
      Group_Title:
      - SRG-OS-000480-GPOS-00227
      NIST800-53R4:
      - CM-6
      Rule_ID: SV-258005r1045069_rule
      STIG_ID: RHEL-09-255145
      Vul_ID: V-258005
{{ end }}

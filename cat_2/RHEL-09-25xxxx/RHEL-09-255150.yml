---

{{ if .Vars.rhel_09_255150 }}
file:
  ssh_config_ignoreknownhosts:
    title: RHEL-09-255150 | RHEL 9 SSH daemon must not allow known hosts authentication.
    path: {{ .Vars.rhel9stig_sshd_config_file }}
    exists: true
    contents:
    - '/(?i)^IgnoreUserKnownHosts {{ .Vars.rhel9stig_sshd_config.ignoreknownhosts }}/'
    meta:
      Cat: 2
      CCI:
      - CCI-000366
      Group_Title:
      - SRG-OS-000480-GPOS-00227
      NIST800-53R4:
      - CM-6
      Rule_ID: SV-258006r1268251_rule
      STIG_ID: RHEL-09-255150
      Vul_ID: V-258006
command:
  ssh_dropin_ignoreknownhosts:
    title: RHEL-09-255150 | RHEL 9 SSH daemon must not allow known hosts authentication.
    exec: grep -hiE '^[[:blank:]]*IgnoreUserKnownHosts([[:blank:]]|=)' /etc/ssh/sshd_config.d/*.conf 2>/dev/null | grep -viE '^[[:blank:]]*IgnoreUserKnownHosts([[:blank:]]+|[[:blank:]]*=[[:blank:]]*){{ .Vars.rhel9stig_sshd_config.ignoreknownhosts }}[[:blank:]]*$'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/(?i)IgnoreUserKnownHosts/'
    meta:
      Cat: 2
      CCI:
      - CCI-000366
      Group_Title:
      - SRG-OS-000480-GPOS-00227
      NIST800-53R4:
      - CM-6
      Rule_ID: SV-258006r1268251_rule
      STIG_ID: RHEL-09-255150
      Vul_ID: V-258006
{{ end }}

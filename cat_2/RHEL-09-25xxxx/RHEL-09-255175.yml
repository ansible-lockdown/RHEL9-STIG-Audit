---

{{ if .Vars.rhel_09_255175 }}
file:
  ssh_config_x11uselocal:
    title: RHEL-09-255175 | RHEL 9 SSH daemon must prevent remote hosts from connecting to the proxy display.
    path: {{ .Vars.rhel9stig_sshd_config_file }}
    exists: true
    contents:
    - '/^X11UseLocalhost {{ .Vars.rhel9stig_sshd_config.x11uselocal }}/'
    meta:
      Cat: 2
      CCI:
      - CCI-000366
      Group_Title:
      - SRG-OS-000480-GPOS-00227
      NIST800-53R4:
      - CM-6
      Rule_ID: SV-258011r1268251_rule
      STIG_ID: RHEL-09-255175
      Vul_ID: V-258011
command:
  ssh_dropin_x11uselocal:
    title: RHEL-09-255175 | RHEL 9 SSH daemon must prevent remote hosts from connecting to the proxy display.
    exec: grep -hiE '^[[:blank:]]*X11UseLocalhost([[:blank:]]|=)' /etc/ssh/sshd_config.d/*.conf 2>/dev/null | grep -viE '^[[:blank:]]*X11UseLocalhost([[:blank:]]+|[[:blank:]]*=[[:blank:]]*){{ .Vars.rhel9stig_sshd_config.x11uselocal }}[[:blank:]]*$'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/(?i)X11UseLocalhost/'
    meta:
      Cat: 2
      CCI:
      - CCI-000366
      Group_Title:
      - SRG-OS-000480-GPOS-00227
      NIST800-53R4:
      - CM-6
      Rule_ID: SV-258011r1268251_rule
      STIG_ID: RHEL-09-255175
      Vul_ID: V-258011
{{ end }}

    title: RHEL-09-654176 | RHEL 9 must audit all uses of the useradd command.
    exists: true
    path: /etc/audit/rules.d/audit.rules
    contents:
    - '/^-a always,exit -F path=/usr/sbin/useradd -F perm=x -F auid>=1000 -F auid!=unset -k privileged-useradd/'

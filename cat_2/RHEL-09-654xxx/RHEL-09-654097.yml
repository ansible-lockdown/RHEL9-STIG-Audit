---

{{ if .Vars.rhel_09_654097 }}
file:
  audit_conf_crond:
    title: RHEL-09-654097 | RHEL 9 must audit any script or executable called by cron as root or by any privileged user.
    exists: true
    path: /etc/audit/rules.d/audit.rules
    contents:
    - '-w /etc/cron.d -p wa -k cronjobs'
    - '-w /var/spool/cron -p wa -k cronjobs'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000471-GPOS-00215
      NIST800-53R4:
      - AU-12
      Rule_ID: SV-279936r1156361_rule
      STIG_ID: RHEL-09-654097
      Vul_ID: V-279936
command:
  audit_running_crond:
    title: RHEL-09-654097 | RHEL 9 must audit any script or executable called by cron as root or by any privileged user.
    exec: auditctl -l | grep -E '/etc/cron.d|/var/spool/cron'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '-w /etc/cron.d -p wa -k cronjobs'
    - '-w /var/spool/cron -p wa -k cronjobs'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000471-GPOS-00215
      NIST800-53R4:
      - AU-12
      Rule_ID: SV-279936r1156361_rule
      STIG_ID: RHEL-09-654097
      Vul_ID: V-279936
{{ end }}

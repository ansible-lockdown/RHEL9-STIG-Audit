---

{{ if .Vars.rhel_09_215105 }}
command:
  systemwide_cryptographic_policy:
    title: RHEL-09-215105 | RHEL 9 must implement a FIPS 140-3-compliant systemwide cryptographic policy.
    exec: update-crypto-policies --show
    exit-status: 0
    stdout:
    - '/^FIPS$/'
    meta:
      Cat: 1
      CCI:
      - CCI-002450
      - CCI-002890
      - CCI-003123
      Group_Title:
      - SRG-OS-000396-GPOS-00176
      - SRG-OS-000393-GPOS-00173
      - SRG-OS-000394-GPOS-00174
      NIST800-53R4:
      - SC-13
      - MA-4
      Rule_ID: SV-258241r1262108_rule
      STIG_ID: RHEL-09-215105
      Vul_ID: V-258241
  systemwide_cryptographic_policy_hash_rsa_size:
    title: RHEL-09-215105 | RHEL 9 must implement a FIPS 140-3-compliant systemwide cryptographic policy. | hash and min_rsa_size
    exec: grep -E 'rsa_size|hash' /etc/crypto-policies/state/CURRENT.pol
    exit-status: 0
    stdout:
    - '/^hash = .*SHA2-256/'
    - '/^hash = .*SHA2-384/'
    - '/^hash = .*SHA2-512/'
    - '/^hash = .*SHA2-224/'
    - '/^hash = .*SHA3-256/'
    - '/^hash = .*SHA3-384/'
    - '/^hash = .*SHA3-512/'
    - '/^hash = .*SHAKE-256/'
    - '!/^hash = .*SHA1/'
    - '/^min_rsa_size = (204[89]|20[5-9][0-9]|2[1-9][0-9]{2}|[3-9][0-9]{3}|[1-9][0-9]{4,})$/'
    meta:
      Cat: 1
      CCI:
      - CCI-002450
      - CCI-002890
      - CCI-003123
      Group_Title:
      - SRG-OS-000396-GPOS-00176
      - SRG-OS-000393-GPOS-00173
      - SRG-OS-000394-GPOS-00174
      NIST800-53R4:
      - SC-13
      - MA-4
      Rule_ID: SV-258241r1262108_rule
      STIG_ID: RHEL-09-215105
      Vul_ID: V-258241
{{ end }}

---

{{ if .Vars.rhel_09_672050 }}
command:
  crypto-policies_bind:
    title: RHEL-09-672050 | RHEL 9 must implement DoW-approved encryption in the bind package.
    exec: if ! rpm -q bind >/dev/null 2>&1; then echo "OK - bind not installed"; elif grep -qE '^[[:blank:]]*include[[:blank:]]+"/etc/crypto-policies/back-ends/bind.config";' /etc/named.conf 2>/dev/null; then echo "OK - bind includes the crypto policy"; else echo "Fail - bind does not include the crypto policy"; fi
    exit-status: 0
    stdout:
    - '/^OK - /'
    - '!/^Fail/'
    meta:
      Cat: 1
      CCI:
      - CCI-002418
      - CCI-002422
      Group_Title:
      - SRG-OS-000423-GPOS-00187
      - SRG-OS-000426-GPOS-00190
      NIST800-53R4:
      - SC-8
      Rule_ID: SV-258242r1262158_rule
      STIG_ID: RHEL-09-672050
      Vul_ID: V-258242
{{ end }}
